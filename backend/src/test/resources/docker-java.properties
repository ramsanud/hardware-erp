# Docker Engine 29 rejects the API version docker-java negotiates by default
# (it advertises 1.32; the daemon's minimum is 1.40), so Testcontainers fails
# with "Could not find a valid Docker environment" and a 400 from /info.
# Pinning the API version here is the documented workaround for Testcontainers
# 1.x - testcontainers-java#11235. Delete this file when the project moves to
# Testcontainers 2.x, which negotiates the version correctly on its own.
api.version=1.44
