# Production. Every secret comes from the environment.
spring:
  flyway:
    # Schema only. db/seed is deliberately absent - CR-009. Production must
    # never receive test accounts.
    locations: classpath:db/migration
    clean-disabled: true
    # BUG-DEPLOY-001. application.yml sets baseline-on-migrate: true, which is
    # right for a long-lived local database but dangerous on a hosted one.
    #
    # When Flyway meets a schema that already contains objects and has no
    # flyway_schema_history, it writes a baseline marker and treats every
    # migration at or below baseline-version as already applied. That default
    # is 1 - so V1 gets SKIPPED, app_user is never created, and Hibernate's
    # ddl-auto: validate then fails building the EntityManagerFactory. The
    # symptom is a cascade that names securityConfig -> appUserDetailsService
    # -> userRepository and never mentions the migration that did not run.
    #
    # A Supabase database is not a virgin schema: it ships with extensions and
    # supporting objects, which is exactly the condition that triggers this.
    #
    # 0 keeps the ability to adopt a non-empty schema while skipping nothing,
    # because no migration is numbered at or below zero.
    baseline-version: 0
  jpa:
    show-sql: false
  datasource:
    hikari:
      # PostgreSQL's default max_connections is 100. Leave headroom for
      # psql sessions, pg_dump and the backup job.
      maximum-pool-size: 20

server:
  forward-headers-strategy: native
  error:
    # Already the default in application.yml; repeated here because these
    # three are the difference between a sanitized error body and one that
    # names internal classes and file paths, and a profile file is where a
    # reader looks to confirm what production actually does.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

# The interactive API browser and the machine-readable schema both describe
# every endpoint, parameter and DTO this application has. That is a map for
# an attacker and of no use to a shop owner, so production serves neither -
# SecurityConfig's permitAll on those paths then matches nothing (CR-045).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    # HTTPS is mandatory. HSTS headers are meaningless without it.
    cookie-secure: true
  mail:
    log-links-when-unconfigured: false
  rate-limit:
    enabled: true
  developer-inspection:
    # Hard false, with no ${...} placeholder, so there is no environment
    # variable that turns developer diagnostics on in production. Belt and
    # braces: DeveloperInspectionService also forces this off whenever the
    # 'prod' profile is active, so a future edit to this line cannot quietly
    # re-enable it either (CR-045).
    enabled: false

# health only, and without details. /actuator/health is the hosting
# platform's liveness probe and is the single actuator path SecurityConfig
# leaves public; env, beans, mappings, configprops, loggers, heapdump and
# threaddump are all off because each one discloses configuration or memory
# contents that production has no reason to publish.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

logging:
  level:
    root: WARN
    com.hardware.erp: INFO
    org.springframework.security: WARN
