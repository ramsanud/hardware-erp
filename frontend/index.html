<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- CR-061. Overwritten at runtime by theme/ThemeColorMeta.tsx once the
         user's palette resolves; this static pair is what the browser paints
         during the very first load, before any script has run. -->
    <meta name="theme-color" content="#f7f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1220" media="(prefers-color-scheme: dark)" />
    <!-- Renders the app edge-to-edge under the status bar when it is opened
         from an iOS home-screen shortcut. Not a PWA: there is no manifest and
         no service worker, deliberately (see CR-061). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hardware ERP" />
    <meta name="format-detection" content="telephone=no" />
    <!-- CR-081: the post-and-lintel H, the same mark as BrandMark.tsx. A favicon
         cannot read the theme, so this one is the Emerald primary. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316794b'/%3E%3Crect x='8' y='7' width='4.5' height='18' rx='1.6' fill='%23fff'/%3E%3Crect x='19.5' y='7' width='4.5' height='18' rx='1.6' fill='%23fff'/%3E%3Crect x='6' y='13.75' width='20' height='4.5' rx='1.6' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Hardware ERP</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
