# CR-059 - self-hosted web tier: serves the built SPA and proxies /api to the
# backend container on the same origin.
#
# Same-origin is the point, not a convenience. The refresh token cookie is
# HttpOnly + SameSite=Strict and scoped to /api/v1/auth (RefreshTokenCookieService);
# a browser only returns it when the API shares the page's origin. Serving the
# UI from one port and the API from another would silently break sign-in
# persistence in a way that looks like a session bug.

upstream erp_api {
    # 'backend' is the service name in docker-compose.selfhosted.yml; 8080 is
    # the port inside the network, regardless of what the host maps.
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The largest upload this application accepts is a 20MB supplier bill
    # document (DocumentUploadValidation.MAX_BYTES, and the purchase_document
    # CHECK constraint). nginx's default is 1MB, which would reject it with a
    # 413 before the request ever reached Spring - so this must stay in step
    # with spring.servlet.multipart.max-file-size in application.yml.
    client_max_body_size 21m;

    # Compress the bundle. Vite already splits vendor chunks; gzip is what
    # makes the first load bearable over a shop's broadband.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container-level probe only. Deliberately not proxied to the backend:
    # this answers "is the web tier up", and the API's own
    # /api/actuator/health answers for the API. Merging them would report a
    # database outage as a frontend failure.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://erp_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # RateLimitFilter and the security audit log key on the client IP
        # (SecurityUtils.clientIp). Without these the whole shop would share
        # one address - this container's - and one user hitting a login limit
        # would lock out everybody. server.forward-headers-strategy=native in
        # application-prod.yml is what makes Spring trust them, and it is safe
        # here precisely because nothing but this nginx can reach the backend
        # port on the compose network.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # A supplier-bill import or a large export can outrun the 60s default.
        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;

        # Streams the CSV/zip exports straight through instead of spooling
        # them to disk first.
        proxy_buffering off;
    }

    # Hashed assets are immutable - a new build produces new filenames - so
    # they can be cached hard. index.html must never be, or a client keeps
    # loading the previous release's asset names after an update.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: React Router owns the paths, so any unmatched URL returns
    # the shell rather than a 404. Restricted to what the app actually serves,
    # so a mistyped /api path still 404s as an API path instead of returning
    # HTML that a fetch() would fail to parse.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
