# Render Blueprint - free tier.
#
# Import this from the Render dashboard (New -> Blueprint) after connecting
# the repository. Everything marked sync:false must be filled in by hand in
# the Render dashboard; nothing secret is committed here.
#
# FREE TIER REALITY, stated plainly:
#   - A free web service sleeps after 15 minutes with no inbound request,
#     and a cold Spring Boot start is 30-60s. The keep-alive ping described
#     in docs/DEPLOYMENT.md is what stops a client demo hitting that.
#   - Free instance hours are 750/month for the whole account. One service
#     kept awake around the clock is ~730h, so this budget supports exactly
#     ONE always-on free service. A second one will exhaust the quota.
#   - Free services have no persistent disk. Nothing may be written to the
#     filesystem and expected to survive a redeploy - this app stores
#     uploads as bytea in PostgreSQL, so that already holds.

services:
  - type: web
    name: hardware-erp-api
    runtime: docker
    plan: free
    # PUT THE DATABASE IN THIS SAME REGION. Nothing else on this page matters
    # as much for startup time.
    #
    # Hibernate runs ddl-auto: validate on every boot - a hard rule in this
    # project - which means metadata queries for ~50 tables and every one of
    # their columns before the application will serve anything. Flyway's
    # history check and Hikari's pooled TLS handshakes come first. Each of
    # those round trips pays the full network latency between this service and
    # PostgreSQL.
    #
    # Co-located, that is sub-millisecond and invisible. Across regions -
    # singapore here against a Supabase project in ap-south-1 (Mumbai), which
    # is roughly 60-90ms round trip - it becomes minutes, and on a free
    # instance's 0.1 shared CPU it is the difference between a boot that
    # finishes and one Render kills with "Port scan timeout reached". That
    # happened on 2026-09-05.
    #
    # A Supabase project's region cannot be changed after creation, so if the
    # two do not match, recreate the database side in the region matching this
    # one (Singapore is ap-southeast-1). Free Render regions: oregon, ohio,
    # virginia, frankfurt, singapore.
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Render probes this to decide the deploy succeeded. application-prod.yml
    # exposes health and nothing else, and SecurityConfig leaves exactly this
    # path public - so no credential is needed and no configuration leaks.
    healthCheckPath: /api/actuator/health

    envVars:
      # 'prod' owns the security posture; 'cloud' adds what is specific to a
      # managed database (CR-059): sslmode=require, pooler-shaped connection
      # defaults, a Hikari pool sized for a pooler rather than for a local
      # PostgreSQL, and cookie-secure pinned true. Without ',cloud' this
      # deploys but connects with the driver's default sslmode and a pool
      # sized for a local database.
      - key: SPRING_PROFILES_ACTIVE
        value: prod,cloud

      # ---- database (Supabase) -------------------------------------------
      # Use the SESSION pooler, not the transaction pooler. Transaction-mode
      # pooling breaks server-side prepared statements and per-session state,
      # and DocumentSequenceService relies on SELECT ... FOR UPDATE held for
      # the caller's transaction (CR-041). The session pooler is also the
      # IPv4-reachable option, which Render needs.
      - key: DB_HOST
        sync: false            # xxxxxx.pooler.supabase.com
      - key: DB_PORT
        value: "5432"          # session pooler. 6543 is the transaction pooler - do not use it
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false            # postgres.xxxxxx
      - key: DB_PASSWORD
        sync: false            # rotate this in Supabase; never commit it

      # ---- auth ------------------------------------------------------------
      # 32 bytes minimum, base64. Generate with:
      #   openssl rand -base64 32
      # JwtSecretGuard refuses to start on the built-in placeholder, so a
      # missing value fails the deploy loudly instead of shipping a known key.
      - key: JWT_SECRET
        generateValue: true

      # The Platform Admin Console signs with its own key and its own issuer
      # (CR-054). This was MISSING here until 2026-09-04, which meant a deploy
      # from this blueprint fell back to the placeholder committed in
      # application.yml - anyone with the source could forge a platform-admin
      # session and reach tenant management, data export and billing for every
      # shop. JwtSecretGuard now refuses to start on that placeholder, and also
      # refuses if this ends up equal to JWT_SECRET; generateValue gives each a
      # separate random value, which is exactly what the two trust boundaries
      # require.
      - key: PLATFORM_ADMIN_JWT_SECRET
        generateValue: true

      # CR-018 - encryption at rest for supplier bank account numbers. Without
      # it SupplierBankAccountEncryptionRunner warns at every boot and those
      # numbers are stored in PLAINTEXT. It was missing from this blueprint
      # until 2026-09-05, when a real deploy logged that warning.
      #
      # Must decode to exactly 32 bytes or FieldEncryptor treats it as unset -
      # silently, with no error. Set it BEFORE any supplier data is entered:
      # rows written in plaintext stay that way until re-processed, and a key
      # added later cannot retroactively protect what has already been stored.
      - key: APP_ENCRYPTION_KEY
        generateValue: true

      - key: COOKIE_SECURE
        value: "true"

      # The frontend is served same-origin through Vercel's /api rewrite, so
      # the browser never makes a cross-site request and CORS is not involved.
      # This stays set only for direct API access (Postman, curl, a probe).
      - key: CORS_ORIGINS
        sync: false            # https://xxxxxx.vercel.app

      # Password-reset links are emailed, so they must point at the FRONTEND
      # origin, never at this service.
      - key: RESET_URL
        sync: false            # https://xxxxxx.vercel.app/reset-password

      # ---- first owner account --------------------------------------------
      # Creates the first OWNER on first boot only. Turn APP_BOOTSTRAP_ENABLED
      # back to false and redeploy once you have signed in and changed the
      # password - there is no self-registration endpoint by design (CR-008).
      - key: APP_BOOTSTRAP_ENABLED
        value: "true"
      - key: APP_BOOTSTRAP_MOBILE
        sync: false            # 10 digits
      - key: APP_BOOTSTRAP_EMAIL
        sync: false
      - key: APP_BOOTSTRAP_PASSWORD
        sync: false            # change it immediately after first sign-in
      - key: APP_BOOTSTRAP_NAME
        sync: false

      # ---- optional --------------------------------------------------------
      # Email is off unless MAIL_USER/MAIL_PASSWORD are set. Password reset
      # then logs the link instead of sending it, which is fine for a demo.
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false            # Gmail app password, not the account password

      # Free Postgres tiers cap connections tightly and this app is one
      # instance - 20 (the application-prod.yml default) is more than the
      # free pooler will grant.
      # application-cloud.yml reads this (default 10). Setting the Spring
      # property directly also works, but going through one documented knob
      # keeps the pool size in a single place per CR-059.
      - key: DB_POOL_SIZE
        value: "5"

      # Free instances are memory-capped at 512MB. Without this the JVM sizes
      # its heap against the host's total memory, not the container's, and
      # gets OOM-killed mid-request.
      # TieredStopAtLevel=1 stops the JIT at C1 instead of compiling to C2.
      # Peak throughput is lower, which does not matter for a shop's request
      # volume, but startup does far less compilation work - and on a free
      # instance's 0.1 shared CPU, startup is the thing that fails. A deploy
      # here timed out on 2026-09-05 having taken 312s on its previous
      # successful boot, with Render's port scan giving up before Tomcat bound.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1"
